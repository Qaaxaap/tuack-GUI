name: Build & Package

on:
  workflow_dispatch:
  push:
    tags: ["*.*.*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux（x86_64）打包
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: 安装 Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: 下载 tuack-ng + typst 二进制
        run: python3 scripts/fetch-binaries.py x86_64-unknown-linux-gnu

      - run: pnpm install --frozen-lockfile

      - name: 打包
        run: pnpm tauri build --config '{"bundle":{"externalBin":["binaries/tuack-ng","binaries/typst"],"resources":["binaries/assets"],"targets":["deb"]}}'

      - uses: actions/upload-artifact@v4
        with:
          name: tuack-gui-linux-x86_64
          path: src-tauri/target/release/bundle/

  windows:
    name: Windows（x86_64）打包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: 下载 tuack-ng + typst 二进制
        run: python scripts/fetch-binaries.py x86_64-pc-windows-msvc

      - run: pnpm install --frozen-lockfile

      - name: 打包
        run: pnpm tauri build --config '{"bundle":{"externalBin":["binaries/tuack-ng","binaries/typst"],"resources":["binaries/assets"],"targets":["nsis"]}}'

      - uses: actions/upload-artifact@v4
        with:
          name: tuack-gui-windows-x86_64
          path: src-tauri/target/release/bundle/
